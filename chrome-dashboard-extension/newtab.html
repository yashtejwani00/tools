<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Removed particles div -->
    
    <div class="time-display" id="timeDisplay"></div>

    <div class="container">
        <div class="header">
            <h1>Chrome Dashboard</h1>
            <p>Your personalized browsing command center</p>
            
            <!-- Custom Search Bar -->
            <div class="search-container">
                <div class="search-box-main">
                    <svg class="search-icon" viewBox="0 0 24 24">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text" id="mainSearchInput" placeholder="Search ZMOB-" autocomplete="off">
                    <button class="search-submit" id="searchSubmit">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="dashboard">
            <!-- Favorites Section -->
            <div class="card">
                <div class="card-title">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    Favorites
                    <div class="favorites-controls">
                        <button class="refresh-btn" id="refreshFavorites" title="Refresh">
                            <svg class="icon" viewBox="0 0 24 24">
                                <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                            </svg>
                        </button>
                        <button class="add-folder-btn" id="addFolder" title="Create New Folder">
                            <svg class="icon" viewBox="0 0 24 24">
                                <path d="M20 6h-8l-2-2H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-1 8h-3v3h-2v-3h-3v-2h3V9h2v3h3v2z"/>
                            </svg>
                        </button>
                        <button class="add-favorite-btn" id="addFavorite" title="Add Bookmark">
                            <svg class="icon" viewBox="0 0 24 24">
                                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <!-- Breadcrumb navigation for folder hierarchy -->
                <div class="breadcrumb-container" id="breadcrumbNav"></div>
                <div class="favorites-grid" id="favoritesGrid">
                    <div class="loading">Loading favorites...</div>
                </div>
            </div>

            <!-- Chrome Controls -->
            <div class="card">
                <div class="card-title">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                    Chrome Controls
                </div>
                <div class="control-buttons">
                    <button class="btn expandable-btn" id="toggleBookmarks">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
                        </svg>
                        Bookmarks
                        <svg class="expand-icon" viewBox="0 0 24 24">
                            <path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/>
                        </svg>
                    </button>
                    
                    <button class="btn expandable-btn" id="toggleReadingList">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                        </svg>
                        Reading List
                        <svg class="expand-icon" viewBox="0 0 24 24">
                            <path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/>
                        </svg>
                    </button>
                    
                    <button class="btn" id="openExtensions">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5C13 2.12 11.88 1 10.5 1S8 2.12 8 3.5V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7 1.49 0 2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5c1.38 0 2.5-1.12 2.5-2.5S21.88 11 20.5 11z"/>
                        </svg>
                        Extensions
                    </button>
                    
                    <button class="btn" id="openPasswords">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                        Passwords
                    </button>
                    
                    <button class="btn add-button" id="addCustomButton">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                        </svg>
                        Add Custom Button
                    </button>
                </div>

                <!-- Expandable Sections -->
                <div class="expandable-content" id="bookmarksContent">
                    <div class="content-header">
                        <h4>Bookmarks</h4>
                        <div class="search-box">
                            <input type="text" id="bookmarkSearch" placeholder="Search bookmarks...">
                        </div>
                    </div>
                    <div class="bookmarks-tree" id="bookmarksTree">
                        <div class="loading">Loading bookmarks...</div>
                    </div>
                </div>

                <div class="expandable-content" id="readingListContent">
                    <div class="content-header">
                        <h4>Reading List</h4>
                        <div class="reading-list-stats" id="readingListStats"></div>
                    </div>
                    <div class="reading-list" id="readingList">
                        <div class="loading">Loading reading list...</div>
                    </div>
                </div>
            </div>

            <!-- Custom Buttons Section -->
            <div class="card" id="customButtonsCard" style="display: none;">
                <div class="card-title">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M22 9V7h-2V5c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-2h2v-2h-2v-2h2v-2h-2V9h2zm-4 10H4V5h14v14zM6 13h5v4H6z"/>
                    </svg>
                    Custom Buttons
                </div>
                <div class="custom-buttons-grid" id="customButtonsGrid">
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for adding favorites -->
    <div class="modal" id="addFavoriteModal">
        <div class="modal-content">
            <h3>Add New Favorite</h3>
            <div class="form-group">
                <label for="favoriteTitle">Title:</label>
                <input type="text" id="favoriteTitle" placeholder="Enter bookmark title">
            </div>
            <div class="form-group">
                <label for="favoriteUrl">URL:</label>
                <input type="text" id="favoriteUrl" placeholder="https://example.com">
            </div>
            <div class="form-group">
                <label for="favoritePosition">Position:</label>
                <select id="favoritePosition">
                    <option value="beginning">Add to beginning</option>
                    <option value="end" selected>Add to end</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button class="btn" id="cancelFavorite">Cancel</button>
                <button class="btn" id="saveFavorite">Save</button>
            </div>
        </div>
    </div>

    <!-- Modal for adding custom buttons -->
    <div class="modal" id="customButtonModal">
        <div class="modal-content">
            <h3>Add Custom Button</h3>
            <div class="form-group">
                <label for="buttonName">Button Name:</label>
                <input type="text" id="buttonName" placeholder="Enter button name">
            </div>
            <div class="form-group">
                <label for="buttonAction">Action Type:</label>
                <select id="buttonAction">
                    <option value="url">Open URL</option>
                    <option value="chrome">Chrome Page</option>
                    <option value="search">Search Google</option>
                    <option value="bookmark">Open Specific Bookmark</option>
                </select>
            </div>
            <div class="form-group">
                <label for="buttonValue">Action Value:</label>
                <input type="text" id="buttonValue" placeholder="Enter URL">
            </div>
            <div class="form-group">
                <label for="buttonIcon">Icon (optional):</label>
                <input type="text" id="buttonIcon" placeholder="Enter emoji or leave blank">
            </div>
            <div class="modal-buttons">
                <button class="btn" id="cancelButton">Cancel</button>
                <button class="btn" id="saveButton">Save</button>
            </div>
        </div>
    </div>

    <!-- Modal for creating new folder -->
    <div class="modal" id="createFolderModal">
        <div class="modal-content">
            <h3>Create New Folder</h3>
            <div class="form-group">
                <label for="folderName">Folder Name:</label>
                <input type="text" id="folderName" placeholder="Enter folder name" maxlength="255">
            </div>
            <div class="form-info">
                <p>Folder will be created in: <strong id="folderLocation">Bookmarks Bar</strong></p>
            </div>
            <div class="modal-buttons">
                <button class="btn" id="cancelFolder">Cancel</button>
                <button class="btn" id="saveFolder">Create Folder</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
