<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome Dashboard</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="visually-hidden">Chrome Dashboard</h1>

            <div class="clock">
                <time class="time-display" id="timeDisplay"></time>
                <div class="date-display" id="dateDisplay"></div>
            </div>

            <!-- Jira ticket search -->
            <div class="search-container">
                <div class="search-box-main">
                    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <span class="search-prefix" aria-hidden="true">ZMOB-</span>
                    <input type="text" id="mainSearchInput" placeholder="ticket number" autocomplete="off" aria-label="Open Jira ticket ZMOB-">
                    <button class="search-submit" id="searchSubmit" title="Open ticket" aria-label="Open ticket">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <main class="dashboard">
            <!-- Favorites -->
            <section class="card card-favorites" aria-labelledby="favoritesHeading">
                <div class="card-title">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    <h2 id="favoritesHeading">Favorites</h2>
                    <div class="favorites-controls">
                        <button class="refresh-btn" id="refreshFavorites" title="Refresh" aria-label="Refresh favorites">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                            </svg>
                        </button>
                        <button class="add-folder-btn" id="addFolder" title="New folder" aria-label="New folder">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M20 6h-8l-2-2H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-1 8h-3v3h-2v-3h-3v-2h3V9h2v3h3v2z"/>
                            </svg>
                        </button>
                        <button class="add-favorite-btn" id="addFavorite" title="Add bookmark" aria-label="Add bookmark">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <!-- Breadcrumb navigation for folder hierarchy -->
                <nav class="breadcrumb-container" id="breadcrumbNav" aria-label="Folder"></nav>
                <div class="favorites-grid" id="favoritesGrid" aria-busy="true">
                    <div class="skeleton skeleton-tile"></div>
                    <div class="skeleton skeleton-tile"></div>
                    <div class="skeleton skeleton-tile"></div>
                    <div class="skeleton skeleton-tile"></div>
                    <div class="skeleton skeleton-tile"></div>
                    <div class="skeleton skeleton-tile"></div>
                </div>
            </section>

            <!-- Jira -->
            <section class="card card-jira" aria-labelledby="jiraHeading">
                <div class="card-title">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
                    </svg>
                    <h2 id="jiraHeading">Jira issues</h2>
                    <div class="card-controls">
                        <button class="refresh-btn" id="refreshJira" title="Refresh" aria-label="Refresh Jira issues">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                            </svg>
                        </button>
                        <button class="settings-btn" id="jiraSettings" title="Jira settings" aria-label="Jira settings">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="jira-stats" id="jiraStats"></div>
                <div class="jira-content" id="jiraContent" aria-busy="true">
                    <div class="skeleton skeleton-row"></div>
                    <div class="skeleton skeleton-row"></div>
                    <div class="skeleton skeleton-row"></div>
                    <div class="skeleton skeleton-row"></div>
                </div>
            </section>

            <!-- Custom buttons -->
            <section class="card card-custom" id="customButtonsCard" aria-labelledby="customHeading">
                <div class="card-title">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
                    </svg>
                    <h2 id="customHeading">Shortcuts</h2>
                    <div class="card-controls">
                        <button class="add-favorite-btn" id="addCustomButton" title="Add shortcut" aria-label="Add shortcut">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="custom-buttons-grid" id="customButtonsGrid">
                </div>
            </section>
        </main>
    </div>

    <!-- Modal for adding favorites -->
    <div class="modal" id="addFavoriteModal" role="dialog" aria-modal="true" aria-labelledby="addFavoriteTitle">
        <div class="modal-content">
            <h3 id="addFavoriteTitle">Add favorite</h3>
            <div class="form-group">
                <label for="favoriteTitle">Title</label>
                <input type="text" id="favoriteTitle" placeholder="Team wiki">
            </div>
            <div class="form-group">
                <label for="favoriteUrl">URL</label>
                <input type="text" id="favoriteUrl" placeholder="https://example.com">
            </div>
            <div class="form-group">
                <label for="favoritePosition">Position</label>
                <select id="favoritePosition">
                    <option value="beginning">First in bookmarks bar</option>
                    <option value="end" selected>Last in bookmarks bar</option>
                </select>
            </div>
            <p class="form-error" role="alert" hidden></p>
            <div class="modal-buttons">
                <button class="btn" id="cancelFavorite">Cancel</button>
                <button class="btn btn-primary" id="saveFavorite">Save</button>
            </div>
        </div>
    </div>

    <!-- Modal for adding custom buttons -->
    <div class="modal" id="customButtonModal" role="dialog" aria-modal="true" aria-labelledby="customButtonTitle">
        <div class="modal-content">
            <h3 id="customButtonTitle">Add shortcut</h3>
            <div class="form-group">
                <label for="buttonName">Name</label>
                <input type="text" id="buttonName" placeholder="Extensions">
            </div>
            <div class="form-group">
                <label for="buttonAction">Action</label>
                <select id="buttonAction">
                    <option value="url">Open URL</option>
                    <option value="chrome">Chrome page</option>
                    <option value="search">Search Google</option>
                    <option value="bookmark">Open a bookmark</option>
                </select>
            </div>
            <div class="form-group">
                <label for="buttonValue">Target</label>
                <input type="text" id="buttonValue" placeholder="https://example.com">
            </div>
            <div class="form-group">
                <label for="buttonIcon">Icon <span class="label-hint">optional</span></label>
                <input type="text" id="buttonIcon" placeholder="An emoji, e.g. 🧩">
            </div>
            <p class="form-error" role="alert" hidden></p>
            <div class="modal-buttons">
                <button class="btn" id="cancelButton">Cancel</button>
                <button class="btn btn-primary" id="saveButton">Save</button>
            </div>
        </div>
    </div>

    <!-- Modal for creating new folder -->
    <div class="modal" id="createFolderModal" role="dialog" aria-modal="true" aria-labelledby="createFolderTitle">
        <div class="modal-content">
            <h3 id="createFolderTitle">New folder</h3>
            <div class="form-group">
                <label for="folderName">Name</label>
                <input type="text" id="folderName" placeholder="Runbooks" maxlength="255">
            </div>
            <div class="form-info">
                <p>Created inside <strong id="folderLocation">All bookmarks</strong></p>
            </div>
            <p class="form-error" role="alert" hidden></p>
            <div class="modal-buttons">
                <button class="btn" id="cancelFolder">Cancel</button>
                <button class="btn btn-primary" id="saveFolder">Create folder</button>
            </div>
        </div>
    </div>

    <!-- Modal for Jira settings -->
    <div class="modal" id="jiraSettingsModal" role="dialog" aria-modal="true" aria-labelledby="jiraSettingsTitle">
        <div class="modal-content">
            <h3 id="jiraSettingsTitle">Jira settings</h3>
            <div class="form-group">
                <label for="jiraBaseUrl">Jira URL</label>
                <input type="url" id="jiraBaseUrl" placeholder="https://your-domain.atlassian.net" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="jiraEmail">Email</label>
                <input type="email" id="jiraEmail" placeholder="you@company.com" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="jiraApiToken">API token</label>
                <input type="password" id="jiraApiToken" placeholder="Paste your Jira API token" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="jiraJql">JQL filter</label>
                <input type="text" id="jiraJql" class="input-mono" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="jiraMaxResults">Max results <span class="label-hint">1–100</span></label>
                <input type="number" id="jiraMaxResults" min="1" max="100" step="1">
            </div>
            <div class="form-info">
                <p>Create an API token at <a href="https://id.atlassian.com/manage-profile/security/api-tokens" target="_blank" rel="noopener noreferrer">id.atlassian.com</a>. Settings are stored locally in this browser only.</p>
            </div>
            <p class="form-error" role="alert" hidden></p>
            <div class="modal-buttons">
                <button class="btn btn-danger" id="clearJiraSettings">Clear credentials</button>
                <button class="btn" id="cancelJiraSettings">Cancel</button>
                <button class="btn btn-primary" id="saveJiraSettings">Save</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
