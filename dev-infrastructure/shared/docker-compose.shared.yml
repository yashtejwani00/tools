version: '3.8'

services:
  mongodb:
    image: mongo:5.0
    container_name: shared-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-CHANGE_ME}
    networks:
      - dev-shared-network
    command: mongod --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: zookeeper:3.4.14
    container_name: shared-zookeeper
    restart: unless-stopped
    ports:
      - "2180:2181"
    networks:
      - dev-shared-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/2181'"]
      interval: 10s
      timeout: 5s
      retries: 5

  hbase:
    image: flokkr/hbase:2.3.3
    container_name: shared-hbase
    user: "0:0"
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "16000:16000"
      - "16010:16010"
      - "16020:16020"
      - "16030:16030"
      - "9090:9090"
      - "8085:8085"
    volumes:
      - hbase-data:/data/hbase
      - hbase-wal-data:/data/hbase-wal
      - ./hbase-standalone:/opt/hbase/conf:ro
    environment:
      - HBASE_HEAPSIZE=1024
      - HBASE_MASTER_HEAPSIZE=512
      - HBASE_RS_HEAPSIZE=512
    networks:
      - dev-shared-network
    entrypoint: ["sh", "-c", "/opt/hbase/conf/bootstrap-standalone.sh"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/16030'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mongo-data:
    driver: local
  hbase-data:
    driver: local
  hbase-wal-data:
    driver: local

networks:
  dev-shared-network:
    external: true
    name: dev-shared-network
